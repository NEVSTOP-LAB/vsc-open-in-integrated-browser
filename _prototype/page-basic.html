<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Test Page</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(120deg, #f9fbff, #eef4ff);
        font-family: Georgia, "Times New Roman", serif;
      }
      .card {
        width: min(560px, 90vw);
        background: #ffffff;
        border: 1px solid #dce6ff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 22px rgba(44, 75, 146, 0.15);
      }
      h2 {
        margin-top: 0;
      }
      .meta {
        color: #3a4a72;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h2>HTML Rendering Test</h2>
      <p class="meta">This page is for quick manual verification in local browser.</p>
      <p>
        Timestamp placeholder: <strong id="ts">not-set</strong>
      </p>
      <button id="btn">Set Current Time</button>
    </section>
    <script>
      const btn = document.getElementById("btn");
      const ts = document.getElementById("ts");
      btn.addEventListener("click", () => {
        ts.textContent = new Date().toISOString();
      });
    </script>
  </body>
</html>
